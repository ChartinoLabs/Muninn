description: >-
  Basic 'show interfaces counters' output from a Catalyst 9300 stack member
  with 48 GigabitEthernet ports, 8 TenGigabitEthernet uplinks, and an
  AppGigabitEthernet container interface. Exercises both the input
  (InOctets/InUcastPkts/InMcastPkts/InBcastPkts) and output
  (OutOctets/OutUcastPkts/OutMcastPkts/OutBcastPkts) sections, including
  rows with non-zero values, all-zero rows, and the abbreviated port-token
  forms (Gi, Te, Ap) that require canonicalization.
platform: Cisco Catalyst 9300
software_version: Unknown
